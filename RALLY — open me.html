 ha! But now? Alphonso Davies, the man has actual rockets strapped to his legs. Bosnia and Herzegovina — one World Cup, 2014, led by Edin Džeko, a proper old-school number nine who simply refuses to retire. Neither's ever lifted the trophy, but both turn up swinging. Lovely stuff."},{id:"m_06",team_a:"USA",flag_a:"🇺🇸",team_b:"Paraguay",flag_b:"🇵🇾",kickoff:"2026-06-13T03:00",stage:"Group D",day:"FRI 12 JUN",tv:[{name:"TV 2 Sport X",free:!1}],fun_fact:"USA, Canada and Mexico are co-hosting — the first three-country World Cup. The 1994 USA edition still holds the record for highest average attendance.",commentary:"Team USA! Hosts back in '94, when they sold out every stadium and the world finally went, oh — they DO like soccer! Christian Pulisic carries the badge now. Paraguay — World Cup regulars, quarter-finalists in 2010, and home to football's wildest goalkeeper ever, Chilavert, who used to score free kicks AND penalties, hahaha, a keeper with a striker's ego! Three a.m. kickoff, so this one is purely for the obsessed. Respect."},{id:"m_03",team_a:"Qatar",flag_a:"🇶🇦",team_b:"Switzerland",flag_b:"🇨🇭",kickoff:"2026-06-13T21:00",stage:"Group E",day:"SAT 13 JUN",tv:[{name:"DR1",free:!0}],fun_fact:"The trophy is 18-carat solid gold and weighs about 6.1 kg. Switzerland is where it all gets organised — FIFA’s HQ sits in Zürich.",commentary:"Qatar — threw the most expensive World Cup in history in 2022, and then, awkwardly, became the first hosts to lose all three group games, ooof, ha! Akram Afif is the local hero though. Switzerland — punching way above a country famous for chocolate, watches, and being suspiciously neutral. Granit Xhaka, all elbows and leadership. And fun fact: FIFA itself lives in Zürich, so technically this is a home game for the paperwork. Cheers!"},{id:"m_04",team_a:"Brazil",flag_a:"🇧🇷",team_b:"Morocco",flag_b:"🇲🇦",kickoff:"2026-06-14T00:00",stage:"Group G",day:"SAT 13 JUN",marquee:!0,tv:[{name:"TV 2 Sport X",free:!1}],fun_fact:"Brazil are the only
