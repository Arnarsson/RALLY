arf"},{id:"e4",name:"Trainers",price:"1.199 kr",emoji:"👟",seed:"rally-ess-shoe"},{id:"e5",name:"Crossbody bag",price:"449 kr",emoji:"👜",seed:"rally-ess-bag"},{id:"e6",name:"Track jacket",price:"899 kr",emoji:"🧥",seed:"rally-ess-jacket"}]},jc=[{id:"m_01",team_a:"Mexico",flag_a:"🇲🇽",team_b:"South Africa",flag_b:"🇿🇦",kickoff:"2026-06-11T21:00",stage:"Group A · Opening match",day:"OPENING NIGHT · THU 11 JUN",featured:!0,tv:[{name:"TV 2",free:!1}],h2h:{last:"2010 World Cup",score:"1–1",note:"the opening match in Johannesburg"},archive:{src:"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/First_game_of_the_2010_FIFA_World_Cup%2C_South_Africa_vs_Mexico.jpg/960px-First_game_of_the_2010_FIFA_World_Cup%2C_South_Africa_vs_Mexico.jpg",credit:"Shine 2010 · CC BY 2.0"},fun_fact:"Estadio Azteca is the only stadium ever to host two World Cup finals (1970 & 1986) — and now it opens 2026. South Africa were the first African nation to host a World Cup, back in 2010.",commentary:"Ohhh here we go, opening night, baby! Mexico — seventeen World Cups deep and STILL bashing their head on that quarter-final ceiling, ha! But nobody, and I mean nobody, parties like El Tri. Their keeper Memo Ochoa turns into Spider-Man every single tournament. And South Africa — first African nation to ever host the whole show, 2010, vuvuzelas, Shakira, the lot! Two teams, zero titles, a hundred percent vibes. Skål!"},{id:"m_05",team_a:"South Korea",flag_a:"🇰🇷",team_b:"Czechia",flag_b:"🇨🇿",kickoff:"2026-06-12T04:00",stage:"Group F",day:"OPENING NIGHT · THU 11 JUN",tv:[{name:"TV 2 Sport X",free:!1}],fun_fact:"A proper night-owl kickoff. The “Mexican wave” went global at Mexico ’86 — South Korea co-hosted in 2002 and stunned everyone by reaching the semi-finals.",commentary:"Four in the morning Copenhagen time? You absolute legend for being awake. South Korea — the 2002 fairytale! Co-hosts who marched all the way to the semis and broke Italian and Spanish hearts, hahaha, they STILL talk about it. Son Heung-min now, pure lightning in boots. Czechia — back in the Czechoslovakia days they reached two World Cup finals, so close yet so far. And Patrik Schick once scored from the halfway line, genuinely! Grab a coffee — this one's for the diehards."},{id:"m_02",team_a:"Canada",flag_a:"🇨🇦",team_b:"Bosnia & Herz.",flag_b:"🇧🇦",kickoff:"2026-06-12T21:00",stage:"Group B",day:"FRI 12 JUN",tv:[{name:"DR1",free:!0}],fun_fact:"This is the first 48-team World Cup — 104 matches in all. Canada are co-hosts and playing their first ever home World Cup.",commentary:"Canada! Co-hosts, and let's be honest, for the longest time their World Cup story was one trip in 1986 and a WHOLE lot of ice hockey, ha! But now? Alphonso Davies, the man has actual rockets strapped to his legs. Bosnia and Herzegovina — one World Cup, 2014, led by Edin Džeko, a proper old-school number nine who simply refuses to retire. Neither's ever lifted the trophy, but both turn up swinging. Lovely stuff."},{id:"m_06",team_a:"USA",flag_a:"🇺🇸",team_b:"Paraguay",flag_b:"🇵🇾",kickoff:"2026-06-13T03:00",stage:"Group D",day:"FRI 12 JUN",tv:[{name:"TV 2 Sport X",free:!1}],fun_fact:"USA, Canada and Mexico are co-hosting — the first three-country World Cup. The 1994 USA edition still holds the record for highest average attendance.",commentary:"Team USA! Hosts back in '94, when they sold out every stadium and the world finally went, oh — they DO like soccer! Christian Pulisic carries the badge now. Paraguay — World Cup regulars, quarter-finalists in 2010, and home to football's wildest goalkeeper ever, Chilavert, who used to score free kicks AND penalties, hahaha, a keeper with a striker's ego! Three a.m. kickoff, so this one is purely for the obsessed. Respect."},{id:"m_03",team_a:"Qatar",flag_a:"🇶🇦",team_b:"Switzerland",flag_b:"🇨🇭",kickoff:"2026-06-13T21:00",stage:"Group E",day:"SAT 13 JUN",tv:[{name:"DR1",free:!0}],fun_fact:"The trophy is 18-carat solid gold and weighs about 6.1 kg. Switzerland is where it all gets organised — FIFA’s HQ sits in Zürich.",commentary:"Qatar — threw the most expensive World Cup in history in 2022, and then, awkwardly, became the first hosts to lose all three group games, ooof, ha! Akram Afif is the local hero though. Switzerland — punching way above a country famous for chocolate, watches, and being suspiciously neutral. Granit Xhaka, all elbows and leadership. And fun fact: FIFA itself lives in Zürich, so technically this is a home game for the paperwork. Cheers!"},{id:"m_04",team_a:"Brazil",flag_a:"🇧🇷",team_b:"Morocco",flag_b:"🇲🇦",kickoff:"2026-06-14T00:00",stage:"Group G",day:"SAT 13 JUN",marquee:!0,tv:[{name:"TV 2 Sport X",free:!1}],fun_fact:"Brazil are the only nation to appear at every World Cup since 1930. Morocco made history in 2022 as the first African and Arab team to reach a World Cup semi-final.",commentary:"NOW we're talking! Brazil — FIVE World Cups, the only nation on earth to show up to every single one since 1930, the gold standard, samba in their boots. From Pelé to Ronaldo to the new kids, they just keep printing magicians. And Morocco?! 2022 — the first African AND first Arab team to ever reach a semi-final, the whole continent lost its mind, hahaha, what a story! Hakimi flying down that wing. Midnight kickoff, worth every yawn. Let's go!"}];function dp(e){const t=wc[El(e.team_a,e.team_b)];return t?{...e,status:t.status,status_detail:t.status_detail,clock:t.clock,completed:t.completed,score_a:t.score_a,score_b:t.score_b,form_a:t.form_a,form_b:t.form_b,venue:t.venue,color_a:t.color_a,color_b:t.color_b,archive:e.archive||t.archive,kickoff_utc:t.kickoff_utc,espn_id:t.espn_id,day:t.day||e.day}:{...e,status:"pre"}}const fp=new Set(jc.map(e=>El(e.team_a,e.team_b))),pp=Sc.filter(e=>!fp.has(El(e.team_a,e.team_b))).map(e=>({id:e.id,team_a:e.team_a,flag_a:e.flag_a,team_b:e.team_b,flag_b:e.flag_b,kickoff:e.kickoff,day:e.day,stage:e.stage,tv:e.tv,status:e.status,status_detail:e.status_detail,clock:e.clock,completed:e.completed,score_a:e.score_a,
