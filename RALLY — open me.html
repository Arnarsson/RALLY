 World Cup story was one trip in 1986 and a WHOLE lot of ice hockey, ha! But now? Alphonso Davies, the man has actual rockets strapped to his legs. Bosnia and Herzegovina — one World Cup, 2014, led by Edin Džeko, a proper old-school number nine who simply refuses to retire. Neither's ever lifted the trophy, but both turn up swinging. Lovely stuff."},{id:"m_06",team_a:"USA",flag_a:"🇺🇸",team_b:"Paraguay",flag_b:"🇵🇾",kickoff:"2026-06-13T03:00",stage:"Group D",day:"FRI 12 JUN",tv:[{name:"TV 2 Sport X",free:!1}],fun_fact:"USA, Canada and Mexico are co-hosting — the first three-country World Cup. The 1994 USA edition still holds the record for highest average attendance.",commentary:"Team USA! Hosts back in '94, when they sold out every stadium and the world finally went, oh — they DO like soccer! Christian Pulisic carries the badge now. Paraguay — World Cup regulars, quarter-finalists in 2010, and home to football's wildest goalkeeper ever, Chilavert, who used to score free kicks AND penalties, hahaha, a keeper with a striker's ego! Three a.m. kickoff, so this one is purely for the obsessed. Respect."},{id:"m_03",team_a:"Qatar",flag_a:"🇶🇦",team_b:"Switzerland",flag_b:"🇨🇭",kickoff:"2026-06-13T21:00",stage:"Group E",day:"SAT 13 JUN",tv:[{name:"DR1",free:!0}],fun_fact:"The trophy is 18-carat solid gold and weighs about 6.1 kg. Switzerland is where it all gets organised — FIFA’s HQ sits in Zürich.",commentary:"Qatar — threw the most expensive World Cup in history in 2022, and then, awkwardly, became the first hosts to lose all three group games, ooof, ha! Akram Afif is the local hero though. Switzerland — punching way above a country famous for chocolate, watches, and being suspiciously neutral. Granit Xhaka, all elbows and leadership. And fun fact: FIFA itself lives in Zürich, so technically this is a home game for the paperwork. Cheers!"},{id:"m_04",team_a:"Brazil",flag_a:"🇧🇷",team_b:"Morocco",flag_b:"🇲🇦",kickoff:"2026-06-14T00:00",stage:"Group G",day:"SAT 13 JUN",marquee:!0,tv:[{name:"TV 2 Sport X",free:!1}],fun_fact:"Brazil are the only nation to appear at every World Cup since 1930. Morocco made history in 2022 as the first African and Arab team to reach a World Cup semi-final.",commentary:"NOW we're talking! Brazil — FIVE World Cups, the only nation on earth to show up to every single one since 1930, the gold standard, samba in their boots. From Pelé to Ronaldo to the new kids, they just keep printing magicians. And Morocco?! 2022 — the first African AND first Arab team to ever reach a semi-final, the whole continent lost its mind, hahaha, what a story! Hakimi flying down that wing. Midnight kickoff, worth every yawn. Let's go!"}],td=e=>[...e||""].reduce((t,r)=>t+(r==="W"?3:r==="D"?1:0),0);function nc(e,t){if(!e||!t)return null;const r=td(e)+1.5,n=td(t)+1.5,i=.26,s=+((1-i)*r/(r+n)).toFixed(3);return{a:s,draw:i,b:+(1-i-s).toFixed(3)}}function tw(e){const t=Yf[pa(e.team_a,e.team_b)];if(!t)return{...e,status:"pre"};const r=nc(t.form_a,t.form_b);return{...e,status:t.status,status_detail:t.status_detail,clock:t.clock,completed:t.completed,score_a:t.score_a,score_b:t.score_b,form_a:t.form_a,form_b:t.form_b,venue:t.venue,color_a:t.color_a,color_b:t.color_b,archive:e.archive||t.archive,prob_a:e.prob_a??(r==null?void 0:r.a)??null,prob_draw:e.prob_draw??(r==null?void 0:r.draw)??null,prob_b:e.prob_b??(r==null?void 0:r.b)??null,prob_source:e.prob_source||(r?"form":null),kickoff_utc:t.kickoff_utc,ext_id:t.ext_id,day:t.day||e.day}}const rw=new Set(Xf.map(e=>pa(e.team_a,e.team_b))),nw=qf.filter(e=>!rw.has(pa(e.team_a,e.team_b))).map(e=>{const t=nc(e.form_a,e.form_b);return{id:e.id,team_a:e.team_a,flag_a:e.flag_a,team_b:e.team_b,flag_b:e.flag_b,kickoff:e.kickoff,day:e.day,stage:e.stage,tv:e.tv,status:e.status,status_detail:e.status_detail,clock:e.clock,completed:e.completed,score_a:e.score_a,score_b:e.score_b,form_a:e.form_a,form_b:e.form_b,venue:e.venue,color_a:e.color_a,color_b:e.color_b,archive:e.archive,prob_a:(t==null?void 0:t.a)??null,prob   <body>
    <!-- Boot splash painted from static HTML so first paint is instant (no wait
         for the inlined JS to parse + React to boot). createRoot().render()
         replaces #root on mount, swapping this for the real splash. Without it,
         #root is empty until ~3.9s on throttled mobile — FCP/LCP killer. -->
    <!-- Sized to exactly match the React SplashScreen headline (text-7xl /
         tracking-tight / -mt-6): if the React repaint were LARGER it would
         register as a new, later LCP candidate and drag LCP to JS-boot time. -->
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0B0B0B;color:#F5F1E6;text-align:center;padding:0 24px">
        <div style="margin-top:-24px">
          <!-- The drop-shadow is invisible on the ink background but inflates the
               painted area to match the React headline's filter ink-overflow —
               without it the React repaint is a 3x-larger LCP candidate. -->
          <div style="font-family:'Archivo Black','Archivo Black Fallback',system-ui,sans-serif;font-size:72px;letter-spacing:-0.025em;color:#A8FF00;line-height:1;filter:drop-shadow(0 2px 24px rgba(0,0,0,0.8))">RALLY</div>
          <div style="font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:24px;color:rgba(245,241,230,.9);margin-top:12px;line-height:1.25">Find your game.<br>Find your people.</div>
        </div>
      </div>
    </div>
  </body>
