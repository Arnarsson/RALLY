ow? Alphonso Davies, the man has actual rockets strapped to his legs. Bosnia and Herzegovina — one World Cup, 2014, led by Edin Džeko, a proper old-school number nine who simply refuses to retire. Neither's ever lifted the trophy, but both turn up swinging. Lovely stuff."},{id:"m_06",team_a:"USA",flag_a:"🇺🇸",team_b:"Paraguay",flag_b:"🇵🇾",kickoff:"2026-06-13T03:00",stage:"Group D",day:"FRI 12 JUN",tv:[{name:"TV 2 Sport X",free:!1}],fun_fact:"USA, Canada and Mexico are co-hosting — the first three-country World Cup. The 1994 USA edition still holds the record for highest average attendance.",commentary:"Team USA! Hosts back in '94, when they sold out every stadium and the world finally went, oh — they DO like soccer! Christian Pulisic carries the badge now. Paraguay — World Cup regulars, quarter-finalists in 2010, and home to football's wildest goalkeeper ever, Chilavert, who used to score free kicks AND penalties, hahaha, a keeper with a striker's ego! Three a.m. kickoff, so this one is purely for the obsessed. Respect."},{id:"m_03",team_a:"Qatar",flag_a:"🇶🇦",team_b:"Switzerland",flag_b:"🇨🇭",kickoff:"2026-06-13T21:00",stage:"Group E",day:"SAT 13 JUN",tv:[{name:"DR1",free:!0}],fun_fact:"The trophy is 18-carat solid gold and weighs about 6.1 kg. Switzerland is where it all gets organised — FIFA’s HQ sits in Zürich.",commentary:"Qatar — threw the most expensive World Cup in history in 2022, and then, awkwardly, became the first hosts to lose all three group games, ooof, ha! Akram Afif is the local hero though. Switzerland — punching way above a country famous for chocolate, watches, and being suspiciously neutral. Granit Xhaka, all elbows and leadership. And fun fact: FIFA itself lives in Zürich, so technically this is a home game for the paperwork. Cheers!"},{id:"m_04",team_a:"Brazil",flag_a:"🇧🇷",team_b:"Morocco",flag_b:"🇲🇦",kickoff:"2026-06-14T00:00",stage:"Group G",day:"SAT 13 JUN",marquee:!0,tv:[{name:"TV 2 Sport X",free:!1}],fun_fact:"Brazil are the only nation to :"•"},ra=[{id:"r_01",kind:"dinner",radius:"private",title:"Sunday lasagne, the flat",blurb:"Three layers minimum or don’t bother. Bring the red, I’ve got the oven.",host:"Sofie",area:"Vesterbro",when:"Sun 18:30",going:5,cap:6,emoji:"🍝",hostStats:{rate:96,hosted:23},access:[],code:"RLY-LASAGNE"},{id:"r_02",kind:"wellness",radius:"private",title:"Saturday sauna, just us",blurb:"La Banchina, dawn slot, dip in the harbour after. No phones, no chat — that’s the rule.",host:"Emma",area:"Christianshavn",when:"Sat 08:00",going:4,cap:5,emoji:"🧖",hostStats:{rate:88,hosted:11},access:["quiet-corner"],code:"RLY-SAUNA-08"},{id:"r_03",kind:"match",radius:"circle",title:"Brazil v Morocco, bring a mate",blurb:"Samba on the speaker, midnight kickoff, samba in their boots. Bring one person I’d like.",host:"Lucas",area:"Refshaleøen",when:"Sat 23:00",going:9,cap:14,emoji:"⚽",hostStats:{rate:82,hosted:7},access:[],code:"RLY-SAMBA-23"},{id:"r_04",kind:"gig",radius:"circle",title:"Loft party + whoever you vouch for",blurb:"Vinyl only, lights low, one rule: if you bring them, you’re responsible for them. Skål.",host:"Mathias",area:"Nørrebro",when:"Fri 22:00",going:18,cap:30,emoji:"🎶",hostStats:{rate:79,hosted:14},access:[],code:"RLY-LOFT-22"},{id:"r_05",kind:"trip",radius:"circle",title:"Møn cliffs day-trip, +1s welcome",blurb:"Early train, white cliffs, one cold swim that we’ll all regret and remember. Pack a sandwich.",host:"Ingrid",area:"Hovedbanegården",when:"Sun 08:15",going:7,cap:12,emoji:"🚆",hostStats:{rate:91,hosted:9},access:["kid-friendly"],code:"RLY-MOEN-08"},{id:"r_06",kind:"run",radius:"community",title:"Tuesday run club — all paces",blurb:"The lakes loop, then coffee. No one gets dropped, that’s the whole point. Back by eight.",host:"Nadia",area:"Søerne",when:"Tue 18:30",going:22,cap:null,emoji:"🏃",hostStats:{rate:94,hosted:38},access:["step-free","sober-friendly"],code:"RLY-RUNCLUB"},{id:"r_07",kind:"match",radius:"community",title:"Five-a-side lot, screen at the bryghus",blurb:"Same shirts off the pitch as on it. We lost 6–1 Sunday — we’ll win the night anyway.",host:"Diego",area:"Nørrebro",when:"Wed 20:00",going:11,cap:16,emoji:"⚽",hostStats:{rate:85,hosted:19},access:[],code:"RLY-FIVEASIDE"},{id:"r_08",kind:"social",radius:"community",title:"Danish class kickoff drinks",blurb:"Hold 3, you survived the present tense, now order a beer in it. Round one’s on the teacher.",host:"Yuki",area:"Indre By",when:"Thu 17:30",going:14,cap:20,emoji:"🍻",hostStats:{rate:90,hosted:6},access:["hearing-loop"],code:"RLY-HOLD3"},{id:"r_09",kind:"swap",radius:"local",title:"Nørrebro clothes swap",blurb:"Bring what you’ve stopped wearing, leave with someone else’s favourite. Nothing changes hands but a smile.",host:"Freja",area:"Nørrebro",when:"Sat 14:00",going:31,cap:null,emoji:"♻️",hostStats:{rate:87,hosted:12},access:["step-free","kid-friendly"],code:"RLY-SWAP-14"},{id:"r_10",kind:"dinner",radius:"local",title:"Street long-table, Jægersborggade",blurb:"Everyone brings one dish, one chair, one neighbour they’ve never met. The street does the rest.",host:"Sofie",area:"Nørrebro",when:"Sun 13:00",going:46,cap:80,emoji:"🍝",hostStats:{rate:96,hosted:23},access:["step-free","kid-friendly"],code:"RLY-LONGTABLE"},{id:"r_11",kind:"loners",radius:"local",title:"Came-alone table, Bjørg’s",blurb:"New to the city, just moved, didn’t know who to ask? Sit here. We saved you the seat on purpose.",host:"Oliver",area:"Indre By",when:"Tonight 19:00",going:8,cap:12,emoji:"🫂",hostStats:{rate:100,hosted:16},access:["sober-friendly","quiet-corner"],code:"RLY-CAMEALONE"},{id:"r_12",kind:"match",radius:"public",title:"Opening night, the big square",blurb:"Mexico v South Africa on the giant screen. Zero titles between them, a hundred percent vibes. Come find us.",host:"RALLY",area:"Rådhuspladsen",when:"Tonight 21:00",going:312,cap:4e3,emoji:"⚽",hostStats:{rate:98,hosted:41},access:["step-free","hearing-loop"],code:"RLY-BIGSQUARE"},{id:"r_13",kind:"run",radius:"public",title:"Harbour parkrun, 5k, no excuses",blurb:"Walk it, jog it, or pretend you’re chasing a bus — nobody’s timing your dignity. Saturdays, free, the whole city’s invited.",host:"RALLY",area:"Islands Brygge",when:"Sat 09:00",going:140,cap:null,emoji:"🏃",hostStats:{rate:97,hosted:52},access:["step-free"],code:"RLY-PARKRUN"},{id:"r_14",kind:"swap",radius:"public",title:"City book giveaway, the lakes",blurb:"Take one, leave one, no money, no rules. The best library in town runs on a park bench.",host:"RALLY",area:"Søerne",when:"Sat 11:00",going:89,cap:null,emoji:"📚",hostStats:{rate:93,hosted:28},access:["step-free","kid-friendly"],code:"RLY-BOOKS-11"},{id:"r_15",kind:"gig",radius:"public",title:"Free open-air set, the gardens",blurb:"Local DJs, golden hour, bring a blanket and someone who needed getting out of the house.",host:"RALLY",area:"Kongens Have",when:"Fri 19:30",going:205,cap:null,emoji:"🎶",hostStats:{rate:95,hosted:33},access:["step-free"],code:"RLY-OPENAIR"},{id:"r_16",kind:"civic",radius:"community",title:"Harbour cleanup + breakfast after",blurb:"Grab a bag, walk the quay, fish out what shouldn’t be there. An hour’s graft, then bacon rolls on us. The harbour we swim in, we keep.",host:"Astrid",area:"Islands Brygge",when:"Sat 09:30",going:27,cap:60,emoji:"🤝",hostStats:{rate:92,hosted:15},access:["step-free","kid-friendly"],code:"RLY-HARBOUR"},{id:"r_17",kind:"civic",radius:"local",title:"Friday food bank, Nørrebro",blurb:"Pack boxes, share a laugh, send food where it’s needed before the weekend. Bring tinned, bring time, bring yourself — all three count the same.",host:"Mariam",area:"Nørrebro",when:"Fri 16:00",going:19,cap:40,emoji:"🤝",hostStats:{rate:99,hosted:47},access:["step-free","quiet-corner"],code:"RLY-FOODBANK"},{id:"r_18",kind:"civic",radius:"public",title:"New-neighbours meet, the library",blurb:"Just landed in the city and the flat’s still in boxes? Come meet the street before you’ve unpacked the kettle. Coffee’s free, the welcome’s warmer.",host:"RALLY",ar     <!-- Boot splash painted from static HTML so first paint is instant (no wait
         for the inlined JS to parse + React to boot). createRoot().render()
         replaces #root on mount, swapping this for the real splash. Without it,
         #root is empty until ~3.9s on throttled mobile — FCP/LCP killer. -->
    <!-- Sized to exactly match the React SplashScreen headline (text-7xl /
         tracking-tight / -mt-6): if the React repaint were LARGER it would
         register as a new, later LCP candidate and drag LCP to JS-boot time.
         The crowd-photo backdrop (same data URI as the React splash, injected
         from splashImage.js by the inlineSplashBackdrop vite plugin) means the
         first paint IS the final splash — Speed Index stops waiting for the
         React boot to "complete" the page visually. -->
