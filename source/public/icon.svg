<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- RALLY app mark — Floodlight: lime on ink, the "gathering" node motif. -->
  <rect width="512" height="512" fill="#0B0B0B"/>
  <!-- faint converging crowd-waves (the gathering, rationed) -->
  <g fill="none" stroke="#A8FF00" stroke-opacity="0.10" stroke-width="13" stroke-linecap="round">
    <path d="M64 372 q192 92 384 0"/>
    <path d="M64 420 q192 92 384 0"/>
  </g>
  <!-- the wordmark glyph -->
  <text x="252" y="350" text-anchor="middle"
        font-family="Archivo Black, Arial Black, sans-serif" font-weight="900"
        font-size="300" fill="#A8FF00">R</text>
  <!-- the lime node: the room converging on one point, ringed in stillness -->
  <circle cx="388" cy="150" r="46" fill="none" stroke="#A8FF00" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="388" cy="150" r="26" fill="none" stroke="#A8FF00" stroke-opacity="0.30" stroke-width="2"/>
  <circle cx="388" cy="150" r="13" fill="#A8FF00"/>
</svg>
